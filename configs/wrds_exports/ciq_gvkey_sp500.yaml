connection:
  username_env: WRDS_USER

export:
  output_dir: ./data/wrds_sp500_2018_2025/raw/wrds_exports
  format: parquet
  compression: snappy
  chunksize: 250000
  overwrite: false
  resume: true
  max_retries: 3
  continue_on_error: false

query:
  name: ciq_gvkey_sp500
  sql: |
    WITH sp500_gvkeys AS (
      SELECT DISTINCT l.gvkey
      FROM crsp.ccmxpf_linktable AS l
      JOIN crsp.dsp500list_v2 AS m
        ON l.lpermno = m.permno
      WHERE m.mbrstartdt <= DATE '2025-12-31'
        AND COALESCE(m.mbrenddt, DATE '9999-12-31') >= DATE '2018-01-01'
        AND COALESCE(l.linkdt, DATE '1900-01-01') <= DATE '2025-12-31'
        AND COALESCE(l.linkenddt, DATE '9999-12-31') >= DATE '2018-01-01'
        AND l.gvkey IS NOT NULL
    ),
    ticker_audit AS (
      SELECT
        t.companyid,
        MIN(t.ticker) AS ticker,
        MIN(t.companyname) AS companyname
      FROM ciq_common.wrds_ticker AS t
      GROUP BY t.companyid
    )
    SELECT DISTINCT
      g.companyid,
      g.gvkey,
      a.ticker,
      a.companyname,
      CAST(NULL AS date) AS startdate,
      CAST(NULL AS date) AS enddate
    FROM ciq_common.wrds_gvkey AS g
    JOIN sp500_gvkeys AS s
      ON g.gvkey = s.gvkey
    LEFT JOIN ticker_audit AS a
      ON g.companyid = a.companyid
    WHERE g.companyid IS NOT NULL
  partition:
    type: year
    start: 2018
    end: 2018
  date_columns:
    - startdate
    - enddate
  integrity:
    non_null_columns:
      - companyid
      - gvkey

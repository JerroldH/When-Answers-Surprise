connection:
  username_env: WRDS_USER

export:
  output_dir: ./data/wrds_sp500_2018_2025/raw/wrds_exports
  format: parquet
  compression: snappy
  chunksize: 250000
  overwrite: false
  resume: true
  max_retries: 3
  continue_on_error: false

query:
  name: crsp_ccmxpf_linktable_sp500
  sql: |
    WITH sp500_permnos AS (
      SELECT DISTINCT permno
      FROM crsp.dsp500list_v2
      WHERE mbrstartdt <= DATE '2025-12-31'
        AND COALESCE(mbrenddt, DATE '9999-12-31') >= DATE '2018-01-01'
    )
    SELECT
      l.gvkey,
      l.linkprim,
      l.liid,
      l.linktype,
      l.lpermno,
      l.lpermco,
      l.usedflag,
      l.linkdt,
      l.linkenddt
    FROM crsp.ccmxpf_linktable AS l
    JOIN sp500_permnos AS u
      ON l.lpermno = u.permno
    WHERE COALESCE(l.linkdt, DATE '1900-01-01') <= DATE '2025-12-31'
      AND COALESCE(l.linkenddt, DATE '9999-12-31') >= DATE '2018-01-01'
  partition:
    type: year
    start: 2018
    end: 2018
  date_columns:
    - linkdt
    - linkenddt
  integrity:
    non_null_columns:
      - gvkey
      - lpermno

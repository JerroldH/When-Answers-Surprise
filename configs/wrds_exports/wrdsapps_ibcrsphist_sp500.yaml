connection:
  username_env: WRDS_USER

export:
  output_dir: ./data/wrds_sp500_2018_2025/raw/wrds_exports
  format: parquet
  compression: snappy
  chunksize: 250000
  overwrite: false
  resume: true
  max_retries: 3
  continue_on_error: false

query:
  name: wrdsapps_ibcrsphist_sp500
  sql: |
    WITH sp500_permnos AS (
      SELECT DISTINCT permno
      FROM crsp.dsp500list_v2
      WHERE mbrstartdt <= DATE '2025-12-31'
        AND COALESCE(mbrenddt, DATE '9999-12-31') >= DATE '2018-01-01'
    )
    SELECT
      l.ticker,
      l.permno,
      l.ncusip,
      l.sdate,
      l.edate,
      l.score
    FROM wrdsapps_link_crsp_ibes.ibcrsphist AS l
    JOIN sp500_permnos AS u
      ON l.permno = u.permno
    WHERE COALESCE(l.sdate, DATE '1900-01-01') <= DATE '2026-01-31'
      AND COALESCE(l.edate, DATE '9999-12-31') >= DATE '2017-01-01'
  partition:
    type: year
    start: 2018
    end: 2018
  date_columns:
    - sdate
    - edate
  integrity:
    non_null_columns:
      - ticker
      - permno

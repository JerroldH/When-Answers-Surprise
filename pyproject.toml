[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "when-answers-surprise"
version = "0.1.0"
description = "When Answers Surprise: Sequential Tone Residualization and Abnormal Returns in Earnings Calls"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "When Answers Surprise authors" }
]
dependencies = [
  "jinja2>=3.1",
  "matplotlib==3.11.1",
  "numpy==2.4.4",
  "pandas>=2.2",
  "pyarrow>=15",
  "pyyaml>=6.0",
  "requests>=2.31",
  "scipy>=1.12",
  "scikit-learn==1.8.0",
  "statsmodels>=0.14",
  "wrds>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]
publication = [
  "pypdf>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
